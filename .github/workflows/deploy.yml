name: Deploy to InfinityFree

on:
  push:
    branches: [main]
  workflow_dispatch: # adds a "Run workflow" button in the Actions tab

# Only let this workflow read the repo (least privilege)
permissions:
  contents: read

# If you push twice quickly, cancel the older deploy instead of
# running two FTP uploads at the same time
concurrency:
  group: deploy-infinityfree
  cancel-in-progress: true

jobs:
  deploy:
    name: Upload via FTP
    runs-on: ubuntu-latest
    timeout-minutes: 15 # free FTP can hang; don't burn Actions minutes

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # config/config.php reads config/secrets.php when it exists.
      # This builds that file from your GitHub secrets so the real
      # database details never live in the repo.
      - name: Generate config/secrets.php
        env:
          S_DB_HOST: ${{ secrets.DB_HOST }}
          S_DB_NAME: ${{ secrets.DB_NAME }}
          S_DB_USER: ${{ secrets.DB_USER }}
          S_DB_PASS: ${{ secrets.DB_PASS }}
          S_APP_KEY: ${{ secrets.ECOCYCLE_APP_KEY }}
        run: |
          python3 - <<'PY'
          import os

          def q(value):
              # Escape for a single-quoted PHP string
              return "'" + value.replace("\\", "\\\\").replace("'", "\\'") + "'"

          values = {
              "db_host": os.environ["S_DB_HOST"],
              "db_port": "3306",
              "db_name": os.environ["S_DB_NAME"],
              "db_user": os.environ["S_DB_USER"],
              "db_pass": os.environ["S_DB_PASS"],
              "app_key": os.environ.get("S_APP_KEY", ""),
              "app_base_url": "https://ecologicalcycle.fwh.is",
          }
          lines = ["<?php", "return ["]
          lines += [f"    {q(k)} => {q(v)}," for k, v in values.items()]
          lines.append("];")
          with open("config/secrets.php", "w") as f:
              f.write("\n".join(lines) + "\n")
          PY

      - name: Deploy to InfinityFree
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}

          # InfinityFree FTP does not support encryption on the free plan
          protocol: ftp
          port: 21

          # Upload the repo root...
          local-dir: ./
          # ...into the folder your domain actually serves.
          # (The plain "htdocs/" at the FTP root is NOT served.)
          server-dir: ecologicalcycle.fwh.is/htdocs/

          # Change to "info" or "verbose" if you need to debug
          log-level: standard

          # Setting exclude replaces the action's defaults,
          # so the .git entries are repeated here on purpose.
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            **/node_modules/**
            **/*.md
            docs/**
            electron/**
            sql/**
            **/*.png.bak
            dashboard_page.png
            .gitignore
            .ftp-deploy-sync-state.json
